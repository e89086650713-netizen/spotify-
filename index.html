  async liked(){
    const r=await api('/me/tracks?limit=50&market=from_token'),t=r.items.map(x=>x.track).filter(x=>x&&x.uri);
    LN={uris:t.filter(ok).map(x=>x.uri)};

    try{it=(await api(`/playlists/${id}/items?limit=100&market=from_token`)).items}catch(e){it=(await api(`/playlists/${id}/tracks?limit=100&market=from_token`)).items}

function doSearch(s){
  clearTimeout(tm1);
  tm1=setTimeout(async()=>{
    const R=$('#res');if(!R)return;const my=++sseq;if(!s){R.innerHTML='';return}
    try{
      const r=await api('/search?type=track,album,playlist&limit=10&market=from_token&q='+encodeURIComponent(s));if(my!==sseq)return;
      const t=(r.tracks?.items||[]).filter(x=>x&&x.uri);L={uris:t.filter(ok).map(x=>x.uri)};
      R.innerHTML=(t.length?'<h2>Треки</h2>'+rows(t):'')+sec('Альбомы',r.albums?.items,'album')+sec('Плейлисты',r.playlists?.items,'playlist')||'<p class="mu" style="margin-top:16px">Ничего не нашлось.</p>';
      UK='';upd();a11y(R);
    }catch(err){R.innerHTML='<p class="mu">'+esc(err.message)+'</p>'}
  },350);
}
function bindSearch(){
  const q=$('#q');q.oninput=e=>doSearch(e.target.value.trim());

async function render(){

}

async function fillSide(){
  try{const it=await getLib('pl');$('#sl').innerHTML=`<div class="sh" data-a="nav" data-v="library">${ic('lib')}<span>Моя медиатека</span></div>`+[LK,...it.map(ent)].map(li).join('');a11y($('#sl'))}catch(e){console.warn('library:',e.message)}
}
function sdk(){
  if(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent))return;
  window.onSpotifyWebPlaybackSDKReady=()=>{
    if(sp)return;sp=new Spotify.Player({name:'Мой плеер (эта вкладка)',getOAuthToken:async cb=>{try{cb(await token())}catch(e){console.warn('sdk token:',e.message)}},volume:C.vol/100});
    sp.addListener('ready',async e=>{
      wp=e.device_id;
      if(C.tab){await poll();if(!S?.is_playing)try{await api('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[wp],play:false})});setTimeout(poll,500)}catch(x){}}
    });
    sp.addListener('not_ready',()=>{wp=null});
    sp.addListener('player_state_changed',st=>{
      if(!st)return poll();
      const c=st.track_window.current_track;
      S={...(S||{}),device:{id:wp,name:'Эта вкладка',type:'Computer'},is_playing:!st.paused,progress_ms:st.position,t:Date.now(),shuffle_state:st.shuffle,repeat_state:['off','context','track'][st.repeat_mode]||'off',item:{id:c.id,uri:c.uri,name:c.name,duration_ms:c.duration_ms||st.duration,artists:c.artists,album:c.album}};
      upd();
    });
    sp.addListener('account_error',()=>toast('Для воспроизведения в браузере нужен Spotify Premium'));
    sp.addListener('authentication_error',m=>toast('Ошибка авторизации: '+m.message+'. Войди заново.'));
    sp.addListener('initialization_error',m=>toast('Браузер не поддерживает плеер (нужен DRM/Widevine): '+m.message));
    sp.addListener('playback_error',m=>toast('Ошибка воспроизведения: '+m.message));
    sp.addListener('autoplay_failed',()=>toast('Браузер заблокировал автозапуск. Нажми Play ещё раз'));
    sp.connect().then(ok=>{if(!ok)toast('Не удалось запустить плеер во вкладке')});
  };
  addEventListener('pagehide',()=>{try{sp&&sp.disconnect()}catch(e){console.warn(e.message)}});
  if(window.Spotify)return window.onSpotifyWebPlaybackSDKReady();
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';document.head.append(s);
}
function setup(){
  const a=$('#app');a.className='x';
  a.innerHTML=`<div class="box"><h1>Подключение Spotify</h1><p class="mu">Нужен Premium и своё приложение в Spotify. Один раз.</p>
<ol><li>Открой developer.spotify.com/dashboard и создай приложение.</li>
<li>В Redirect URI добавь адрес этого Mini App:<br><code>${esc(REDIR)}</code></li>
<li>Отметь Web API и Web Playback SDK, сохрани.</li>
<li>Скопируй Client ID и вставь сюда:</li></ol>
<input class="q" id="cid" placeholder="Client ID" autocomplete="off"><button class="go" data-a="sv">Сохранить</button></div>`;
}
function loginScreen(err){
  const a=$('#app');a.className='x';
  a.innerHTML=`<div class="box"><h1>Музыка</h1><p class="mu" style="margin:8px 0 24px">${err?esc(err):'Войди через свой аккаунт Spotify. Пароль приложение не видит и не хранит.'}</p><button class="go" data-a="lg">Войти через Spotify</button><button class="lnk" data-a="rs">Сменить Client ID</button></div>`;
}
async function boot(){
  if(TG){TG.ready();TG.expand();try{TG.disableVerticalSwipes()}catch(e){}}
  if(C.img===1){const b=await idb('get');if(b)BGU=URL.createObjectURL(b)}
  applyC();
  const q=new URLSearchParams(location.search);
  let authErr='';
  if(q.get('code')&&gs('cid')){
    if(q.get('state')!==gs('st'))authErr='Проверка state не пройдена. Войди заново.';
    else try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:REDIR,code_verifier:gs('v')})}
    catch(e){tok=null;LS.removeItem('tok');authErr=e.message==='auth'?'Spotify отклонил код авторизации. Проверь Redirect URI и войди заново.':e.message}
    LS.removeItem('v');LS.removeItem('st');history.replaceState({},'',REDIR);
  }
  if(!gs('cid'))setup();else if(!tok)loginScreen(q.get('error')?'Spotify вернул ошибку: '+q.get('error'):authErr);else app();
}
boot();
